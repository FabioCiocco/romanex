services:
  - type: web
    name: romanex-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.26.1 --activate && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        value: info@romanex.it
