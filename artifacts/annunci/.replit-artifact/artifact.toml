kind = "web"
previewPath = "/"
title = "Sito Annunci"
version = "1.0.0"
id = "artifacts/annunci"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19793

[services.development]
run = "pnpm --filter @workspace/annunci run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/annunci", "run", "build" ]
publicDir = "artifacts/annunci/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19793"
BASE_PATH = "/"
