openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for sito annunci
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: annunci
    description: Annunci operations
  - name: categorie
    description: Categorie operations
  - name: stats
    description: Statistics operations
  - name: forum
    description: Forum operations
  - name: profilo
    description: User profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /annunci:
    get:
      operationId: listAnnunci
      tags: [annunci]
      summary: Lista annunci con filtri
      parameters:
        - name: categoria
          in: query
          schema:
            type: ["string", "null"]
        - name: q
          in: query
          schema:
            type: ["string", "null"]
        - name: prezzoMin
          in: query
          schema:
            type: ["integer", "null"]
        - name: prezzoMax
          in: query
          schema:
            type: ["integer", "null"]
        - name: citta
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Lista annunci
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnunciListResponse"
    post:
      operationId: createAnnuncio
      tags: [annunci]
      summary: Crea un nuovo annuncio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnuncioBody"
      responses:
        "201":
          description: Annuncio creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annuncio"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /annunci/recenti:
    get:
      operationId: getAnnunciRecenti
      tags: [annunci]
      summary: Annunci pubblicati di recente
      responses:
        "200":
          description: Annunci recenti
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Annuncio"

  /annunci/in-evidenza:
    get:
      operationId: getAnnunciInEvidenza
      tags: [annunci]
      summary: Annunci in evidenza/sponsorizzati
      responses:
        "200":
          description: Annunci in evidenza
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Annuncio"

  /annunci/{id}:
    get:
      operationId: getAnnuncio
      tags: [annunci]
      summary: Dettaglio annuncio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dettaglio annuncio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annuncio"
        "404":
          description: Annuncio non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAnnuncio
      tags: [annunci]
      summary: Aggiorna annuncio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnuncioBody"
      responses:
        "200":
          description: Annuncio aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annuncio"
        "404":
          description: Annuncio non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAnnuncio
      tags: [annunci]
      summary: Elimina annuncio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Annuncio eliminato
        "404":
          description: Annuncio non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /categorie:
    get:
      operationId: listCategorie
      tags: [categorie]
      summary: Lista categorie disponibili
      responses:
        "200":
          description: Lista categorie
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Statistiche del sito (totale annunci, per categoria, ecc.)
      responses:
        "200":
          description: Statistiche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

  /forum/categorie:
    get:
      operationId: getForumCategorie
      tags: [forum]
      summary: Lista categorie del forum
      responses:
        "200":
          description: Lista categorie
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /forum:
    get:
      operationId: listForumThreads
      tags: [forum]
      summary: Lista discussioni forum
      parameters:
        - name: categoria
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Lista discussioni
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumListResponse"
    post:
      operationId: createForumThread
      tags: [forum]
      summary: Crea nuova discussione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForumThreadBody"
      responses:
        "201":
          description: Discussione creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThread"

  /forum/{id}:
    get:
      operationId: getForumThread
      tags: [forum]
      summary: Dettaglio discussione con risposte
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discussione con risposte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadWithReplies"
        "404":
          description: Non trovata
    delete:
      operationId: deleteForumThread
      tags: [forum]
      summary: Elimina discussione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminata

  /forum/{id}/risposte:
    post:
      operationId: createForumReply
      tags: [forum]
      summary: Aggiungi risposta a una discussione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForumReplyBody"
      responses:
        "201":
          description: Risposta aggiunta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReply"

  /forum/{threadId}/risposte/{replyId}:
    delete:
      operationId: deleteForumReply
      tags: [forum]
      summary: Elimina risposta
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: integer
        - name: replyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Eliminata

  /profilo:
    get:
      operationId: getMyProfile
      tags: [profilo]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertMyProfile
      tags: [profilo]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserProfileBody"
      responses:
        "200":
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Annuncio:
      type: object
      properties:
        id:
          type: integer
        titolo:
          type: string
        descrizione:
          type: string
        prezzo:
          type: ["integer", "null"]
        categoria:
          type: string
        citta:
          type: string
        contatto:
          type: string
        immagineUrl:
          type: ["string", "null"]
        inEvidenza:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - titolo
        - descrizione
        - categoria
        - citta
        - contatto
        - inEvidenza
        - createdAt
        - updatedAt

    AnnunciListResponse:
      type: object
      properties:
        annunci:
          type: array
          items:
            $ref: "#/components/schemas/Annuncio"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - annunci
        - total
        - page
        - limit
        - totalPages

    CreateAnnuncioBody:
      type: object
      properties:
        titolo:
          type: string
        descrizione:
          type: string
        prezzo:
          type: ["integer", "null"]
        categoria:
          type: string
        citta:
          type: string
        contatto:
          type: string
        immagineUrl:
          type: ["string", "null"]
      required:
        - titolo
        - descrizione
        - categoria
        - citta
        - contatto

    UpdateAnnuncioBody:
      type: object
      properties:
        titolo:
          type: string
        descrizione:
          type: string
        prezzo:
          type: ["integer", "null"]
        categoria:
          type: string
        citta:
          type: string
        contatto:
          type: string
        immagineUrl:
          type: ["string", "null"]

    Categoria:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        icona:
          type: string
        descrizione:
          type: string
        count:
          type: integer
      required:
        - id
        - nome
        - icona
        - descrizione
        - count

    SiteStats:
      type: object
      properties:
        totaleAnnunci:
          type: integer
        annunciOggi:
          type: integer
        totaleCategorie:
          type: integer
        cittaPiuAttive:
          type: array
          items:
            $ref: "#/components/schemas/CittaCount"
        annunciPerCategoria:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaCount"
      required:
        - totaleAnnunci
        - annunciOggi
        - totaleCategorie
        - cittaPiuAttive
        - annunciPerCategoria

    CittaCount:
      type: object
      properties:
        citta:
          type: string
        count:
          type: integer
      required:
        - citta
        - count

    CategoriaCount:
      type: object
      properties:
        categoria:
          type: string
        count:
          type: integer
      required:
        - categoria
        - count

    ForumThread:
      type: object
      properties:
        id:
          type: integer
        titolo:
          type: string
        corpo:
          type: string
        categoria:
          type: string
        autore:
          type: string
        autoreClerkId:
          type: ["string", "null"]
        risposteCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - titolo
        - corpo
        - categoria
        - autore
        - risposteCount
        - createdAt
        - updatedAt

    ForumReply:
      type: object
      properties:
        id:
          type: integer
        threadId:
          type: integer
        corpo:
          type: string
        autore:
          type: string
        autoreClerkId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - threadId
        - corpo
        - autore
        - createdAt

    ForumThreadWithReplies:
      type: object
      properties:
        thread:
          $ref: "#/components/schemas/ForumThread"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/ForumReply"
      required:
        - thread
        - replies

    ForumListResponse:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ForumThread"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
      required:
        - threads
        - total
        - page
        - limit
        - totalPages

    CreateForumThreadBody:
      type: object
      properties:
        titolo:
          type: string
        corpo:
          type: string
        categoria:
          type: string
        autore:
          type: string
        autoreClerkId:
          type: ["string", "null"]
      required:
        - titolo
        - corpo
        - categoria
        - autore

    CreateForumReplyBody:
      type: object
      properties:
        corpo:
          type: string
        autore:
          type: string
        autoreClerkId:
          type: ["string", "null"]
      required:
        - corpo
        - autore

    UserProfile:
      type: object
      properties:
        clerkId:
          type: string
        username:
          type: ["string", "null"]
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        universita:
          type: string
        annoCorso:
          type: string
        corsoDiLaurea:
          type: string
        telefono:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - clerkId
        - nome
        - cognome
        - email
        - universita
        - annoCorso
        - corsoDiLaurea
        - createdAt
        - updatedAt

    UpsertUserProfileBody:
      type: object
      properties:
        username:
          type: ["string", "null"]
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        universita:
          type: string
        annoCorso:
          type: string
        corsoDiLaurea:
          type: string
        telefono:
          type: ["string", "null"]
      required:
        - nome
        - cognome
        - email
        - universita
        - annoCorso
        - corsoDiLaurea
